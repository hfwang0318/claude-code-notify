name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: python -m pip install . ruff

      - name: Static checks
        run: python -m ruff check claude_code_notify claude_notify_server.py tests

      - name: Compile
        run: >-
          python -m compileall -q
          claude_code_notify
          claude_notify_server.py
          claude_approval_hook.py
          claude_notify_hook.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

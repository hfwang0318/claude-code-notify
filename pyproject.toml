[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-notify"
version = "3.0.0"
description = "Cross-platform desktop notifications and permission approvals for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "paramiko>=3.5,<6",
]

[project.scripts]
claude-code-notify = "claude_code_notify.app:main"

[tool.setuptools.packages.find]
include = ["claude_code_notify*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"claude_notify_server.py" = ["F403"]
